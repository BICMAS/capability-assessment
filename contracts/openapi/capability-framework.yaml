      properties:
        profileVersionId:
          type: string
        contextVersion:
          type: integer
        contextHash:
          type: string
        round:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/RoleProfileQuestion"
        unresolved:
          type: array
          items:
            type: string
        complete:
          type: boolean
        snapshot:
          $ref: "#/components/schemas/RoleProfileContextSnapshot"
    RoleProfileQuestion:
      type: object
      additionalProperties: false
      required: [id, profileVersionId, contextVersion, round, field, question, critical, answer, unresolved, askedActorId, answeredActorId, askedAt]
      properties:
        id:
          type: string
        profileVersionId:
          type: string
        contextVersion:
          type: integer
        round:
          type: integer
        field:
          type: string
        question:
          type: string
        critical:
          type: boolean
        answer:
          type: string
        unresolved:
          type: boolean
        authoredBy:
          type: string
          enum: [service, model, service_after_model_error]
          description: service questions are prepared from recorded gaps. model questions use provider wording. service_after_model_error means the provider failed and the service question was kept.
        reason:
          type: string
          description: Why this question is being asked.
        options:
          type: array
          items:
            type: string
          description: Predefined answers when the field has a fixed set of values.
        askedActorId:
          type: string
        answeredActorId:
          type: string
        askedAt:
          type: string
          format: date-time
        answeredAt:
          type: string
          format: date-time

openapi: 3.0.3
info:
  title: Capability framework
  version: 0.1.0
  description: Versioned capability frameworks and role skills profiles. Published framework versions and published profile versions are immutable and do not share lifecycle states. Editing a published framework version inserts the next framework draft.
servers:
  - url: http://localhost:8084
paths:
  /frameworks:
    post:
      operationId: createFrameworkDraft
      summary: Create a framework and its first draft version
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFramework"
      responses:
        "201":
          description: Draft version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkVersion"
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
  /framework-versions:
    get:
      operationId: listFrameworkVersions
      summary: List framework versions in the caller's organisation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Framework versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrameworkVersion"
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
  /framework-versions/{versionId}:
    get:
      operationId: readFrameworkVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      responses:
        "200":
          description: Framework version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkVersion"
        "404":
          description: Version not found in this organisation
    patch:
      operationId: patchFrameworkRole
      summary: Rename a role on a draft version
      description: A published version rejects the patch and stays unchanged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRole"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkVersion"
        "409":
          description: Published version cannot be changed
  /framework-versions/{versionId}/publish:
    post:
      operationId: publishFrameworkVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      responses:
        "200":
          description: Published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkVersion"
        "409":
          description: Version is already published or a proposal is still pending
  /published-frameworks:
    get:
      operationId: listPublishedFrameworks
      summary: Read published framework versions in the caller's organisation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Published framework versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrameworkVersion"
  /framework-versions/{versionId}/approve:
    post:
      operationId: approveFrameworkVersion
      summary: Approve a draft or in-review version when no proposal is pending
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      responses:
        "200":
          description: Approved version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkVersion"
        "409":
          description: A proposal is still pending, or the version is immutable
  /framework-versions/{versionId}/indicators/{indicatorId}:
    patch:
      operationId: updateBehaviouralIndicator
      summary: Save a behavioural indicator on an editable version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
        - $ref: "#/components/parameters/indicatorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIndicator"
      responses:
        "200":
          description: Updated indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicator"
        "409":
          description: Published version cannot be changed
  /framework-versions/{versionId}/next-draft:
    post:
      operationId: createNextFrameworkDraft
      summary: Insert the next draft from a version without changing the source
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      responses:
        "201":
          description: New draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkVersion"
  /framework-versions/{versionId}/roles:
    post:
      operationId: addFrameworkRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRole"
      responses:
        "201":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "409":
          description: Published version cannot be changed
  /framework-versions/{versionId}/capabilities:
    post:
      operationId: addFrameworkCapability
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapability"
      responses:
        "201":
          description: Capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"
  /framework-versions/{versionId}/requirements:
    post:
      operationId: addRoleCapabilityRequirement
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequirement"
      responses:
        "201":
          description: Requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
  /framework-versions/{versionId}/role-capabilities:
    post:
      operationId: addFrameworkRoleCapability
      summary: Create a capability and its role requirement in one transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleCapability"
      responses:
        "201":
          description: Capability and requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCapability"
        "409":
          description: Published version cannot be changed
  /framework-versions/{versionId}/indicators:
    post:
      operationId: addBehaviouralIndicator
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndicator"
      responses:
        "201":
          description: Behavioural indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicator"
  /imports:
    post:
      operationId: importFrameworkCsv
      summary: Store a capability CSV and create a draft with review proposals
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Draft created from valid rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Required columns are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"
        "422":
          description: No valid rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /framework-versions/{versionId}/in-review:
    post:
      operationId: submitFrameworkForReview
      summary: Move a draft to in_review when no proposal is pending
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      responses:
        "200":
          description: Version in review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameworkVersion"
        "409":
          description: A proposal is still pending, or the version is immutable
  /framework-versions/{versionId}/proposals/{proposalId}:
    post:
      operationId: decideReviewProposal
      summary: Accept, edit, or reject a pending proposal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
        - $ref: "#/components/parameters/proposalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideProposal"
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "409":
          description: Published version cannot be changed
  /profile-roles:
    post:
      operationId: createProfileRole
      summary: Register a role identity for a skills profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRole"
      responses:
        "201":
          description: Role identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRole"
        "400":
          description: Invalid role
        "409":
          description: Role name already exists in this organisation
  /canonical-skills:
    post:
      operationId: createCanonicalSkill
      summary: Register a canonical skill that a profile can reference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCanonicalSkill"
      responses:
        "201":
          description: Canonical skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSkill"
        "400":
          description: Invalid category or definition
  /role-profiles:
    post:
      operationId: createRoleProfileDraft
      summary: Create a role skills profile and its first draft version
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleProfile"
      responses:
        "201":
          description: Profile and current draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfile"
        "404":
          description: Role or framework version was not found in this organisation
        "409":
          description: This role already has a profile
  /role-profiles/{profileId}:
    get:
      operationId: readRoleProfile
      summary: Read a profile and its current version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/profileId"
      responses:
        "200":
          description: Profile and current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfile"
        "404":
          description: Profile was not found in this organisation
  /role-profiles/{profileId}/versions:
    get:
      operationId: listRoleProfileVersions
      summary: List every version of a role profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/profileId"
      responses:
        "200":
          description: Profile versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleProfileVersion"
        "404":
          description: Profile was not found in this organisation
  /role-profiles/{profileId}/compare:
    get:
      operationId: compareRoleProfileVersions
      summary: Compare skill assignments between two versions of one profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/profileId"
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileComparison"
        "404":
          description: Profile or version was not found in this organisation
  /role-profiles/{profileId}/history:
    get:
      operationId: readRoleProfileHistory
      summary: Read authorised audit events and reviewer comments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/profileId"
      responses:
        "200":
          description: Profile history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileHistory"
        "404":
          description: Profile was not found in this organisation
  /role-profile-versions/{versionId}:
    patch:
      operationId: updateRoleProfileContext
      summary: Update editable role context on a draft
      description: Clients cannot set workflow status. expectedRevision must match the stored revision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleProfileContext"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileVersion"
        "409":
          description: Stale revision or the version is no longer a draft
  /role-profile-versions/{versionId}/skills:
    post:
      operationId: addRoleProfileSkill
      summary: Add a skill assignment to a draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRoleProfileSkill"
      responses:
        "201":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileVersion"
        "400":
          description: Invalid category, proficiency, priority, or provenance
        "409":
          description: Duplicate skill or stale revision
  /role-profile-versions/{versionId}/skills/{skillAssignmentId}:
    patch:
      operationId: updateRoleProfileSkill
      summary: Edit a skill assignment on a draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
        - $ref: "#/components/parameters/skillAssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleProfileSkill"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileVersion"
        "409":
          description: Stale revision or the version is immutable
    delete:
      operationId: removeRoleProfileSkill
      summary: Remove a skill assignment from a draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
        - $ref: "#/components/parameters/skillAssignmentId"
        - name: expectedRevision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileVersion"
  /role-profile-versions/{versionId}/skill-order:
    put:
      operationId: reorderRoleProfileSkills
      summary: Reorder skill assignments on a draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRoleProfileSkills"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileVersion"
  /role-profile-versions/{versionId}/submit:
    post:
      operationId: submitRoleProfile
      summary: Submit a complete draft for review
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleProfileRevision"
      responses:
        "200":
          description: Version in review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileVersion"
        "409":
          description: The version is not a draft or the revision is stale
  /role-profile-versions/{versionId}/publish:
    post:
      operationId: publishRoleProfile
      summary: Publish a profile that is in review
      description: Publication is a server-side transition from profile_in_review. Clients cannot set the published status directly.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleProfileRevision"
      responses:
        "200":
          description: Immutable published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileVersion"
        "409":
          description: The version has not passed review or the revision is stale
  /role-profile-versions/{versionId}/next-draft:
    post:
      operationId: createNextRoleProfileDraft
      summary: Insert the next draft from a published profile version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleProfileRevision"
      responses:
        "201":
          description: New draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileVersion"
        "409":
          description: The source version is not the latest published version
  /role-profile-versions/{versionId}/comments:
    post:
      operationId: commentOnRoleProfile
      summary: Add a reviewer comment while the version is in review
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleProfileComment"
      responses:
        "201":
          description: Reviewer comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileComment"
        "409":
          description: Comments are only accepted while the version is in review
  /role-profile-versions/{versionId}/clarification:
    post:
      operationId: startRoleProfileClarification
      summary: Ask for missing role context and save the session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      responses:
        "200":
          description: Clarification session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileClarification"
    get:
      operationId: readRoleProfileClarification
      summary: Resume a saved clarification session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      responses:
        "200":
          description: Saved clarification session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileClarification"
  /role-profile-versions/{versionId}/clarification/answers:
    post:
      operationId: answerRoleProfileClarification
      summary: Save clarification answers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleProfileAnswers"
      responses:
        "200":
          description: Updated clarification session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileClarification"
  /role-profile-versions/{versionId}/generation:
    post:
      operationId: startRoleProfileGeneration
      summary: Queue role skills profile generation for a context version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/versionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRoleProfileGeneration"
      responses:
        "202":
          description: Generation job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileGenerationJob"
        "200":
          description: Existing generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileGenerationJob"
        "409":
          description: The context is stale or critical information is unresolved
        "429":
          description: The tenant generation budget is exhausted
  /role-profile-jobs/{jobId}:
    get:
      operationId: readRoleProfileGenerationJob
      summary: Read a role skills profile generation job
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: Generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileGenerationJob"
  /role-profile-jobs/{jobId}/retry:
    post:
      operationId: retryRoleProfileGenerationJob
      summary: Queue the same generation job again when the context has not changed
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "202":
          description: Generation job queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileGenerationJob"
        "409":
          description: The stored context no longer matches the job
  /role-profile-jobs/{jobId}/cancel:
    post:
      operationId: cancelRoleProfileGenerationJob
      summary: Cancel a queued or running generation job
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: Generation job cancellation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleProfileGenerationJob"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    proposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
    profileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
    skillAssignmentId:
      name: skillAssignmentId
      in: path
      required: true
      schema:
        type: string
    indicatorId:
      name: indicatorId
      in: path
      required: true
      schema:
        type: string
  schemas:
    FrameworkVersion:
      type: object
      additionalProperties: false
      required: [id, organisationId, frameworkId, frameworkName, versionNumber, status, roles, capabilities, requirements, rowErrors, proposals]
      properties:
        id:
          type: string
        organisationId:
          type: string
        frameworkId:
          type: string
        frameworkName:
          type: string
        versionNumber:
          type: integer
        status:
          type: string
          enum: [draft, in_review, approved, published, retired]
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        rowErrors:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
    Proposal:
      type: object
      additionalProperties: false
      required: [id, kind, status, capabilityCode, message]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [duplicate_capability_code, missing_required_level]
        status:
          type: string
          enum: [pending, accepted, edited, rejected]
        capabilityCode:
          type: string
        message:
          type: string
    RowError:
      type: object
      additionalProperties: false
      required: [row, message]
      properties:
        row:
          type: integer
        message:
          type: string
    ImportResult:
      type: object
      additionalProperties: false
      required: [objectKey, rowErrors, proposals]
      properties:
        objectKey:
          type: string
        version:
          $ref: "#/components/schemas/FrameworkVersion"
        rowErrors:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
    ImportError:
      type: object
      additionalProperties: false
      required: [objectKey, missingColumns, rowErrors]
      properties:
        objectKey:
          type: string
        missingColumns:
          type: array
          items:
            type: string
        rowErrors:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
    UpdateIndicator:
      type: object
      additionalProperties: false
      required: [statement]
      properties:
        statement:
          type: string
    DecideProposal:

          type: string
        createdByPersonId:
          type: string
        createdAt:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/RoleProfileVersion"
    RoleProfileVersion:
      type: object
      additionalProperties: false
      required: [id, profileId, organisationId, versionNumber, revision, status, purpose, responsibilities, businessOutcomes, decisionScope, industry, region, teamSize, reportingLevel, frameworkVersionId, sources, skills, ai, createdAt]
      properties:
        id:
          type: string
        profileId:
          type: string
        organisationId:
          type: string
        versionNumber:
          type: integer
        revision:
          type: integer
        status:
          $ref: "#/components/schemas/ProfileStatus"
        purpose:
          type: string
        responsibilities:
          type: string
        businessOutcomes:
          type: string
        decisionScope:
          type: string
        industry:
          type: string
        region:
          type: string
        teamSize:
          type: integer
          nullable: true
        reportingLevel:
          type: string
        organogramId:
          type: string
          description: Organogram that contains the selected position. Empty when the draft is not linked to a position.
        positionId:
          type: string
          description: Selected organogram position. Department and reporting line stay in the directory.
        businessUnit:
          type: string
        subIndustry:
          type: string
        organisationalContext:
          type: string
        frameworkVersionId:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RoleProfileSource"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/RoleProfileSkill"
        ai:
          $ref: "#/components/schemas/RoleProfileAI"
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        submittedByPersonId:
          type: string
        submissionCycle:
          type: integer
        workflowStage:
          type: string
        approvedAt:
          type: string
          format: date-time
        approvedByPersonId:
          type: string
    RoleProfileSource:
      type: object
      additionalProperties: false
      required: [id, title, referenceUri]
      properties:
        id:
          type: string
        title:
          type: string
        referenceUri:
          type: string
        kind:
          type: string
          enum: [reference, job_description]
          default: reference
          description: A job description is a source of kind job_description. Other authorised references use reference. Omitted values are stored as reference.
        body:
          type: string
          description: Job description text entered by the user. Empty when a file was stored without extracted text.
        origin:
          type: string
          enum: [user, imported, ai_suggested]
          description: user means the person entered it, imported means it came from a stored document, and ai_suggested means a model proposed it. The service does not invent user-supplied text.

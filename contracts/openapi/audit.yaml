openapi: 3.0.3
info:
  title: Audit
  version: 0.1.0
  description: Append-only organisation-scoped audit records. This API has no update or delete operations.
servers:
  - url: http://localhost:8081
paths:
  /records:
    get:
      operationId: listRecords
      summary: List audit records for the caller's organisation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Audit records for the authenticated admin's organisation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Record:
      type: object
      additionalProperties: false
      required:
        - actorPersonId
        - organisationId
        - action
        - entityType
        - entityId
        - occurredAt
      properties:
        actorPersonId:
          type: string
        organisationId:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        occurredAt:
          type: string
          format: date-time
